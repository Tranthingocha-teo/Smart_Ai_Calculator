name: "🐛 Bug Report / Báo cáo Lỗi"
description: "Báo cáo lỗi hoặc hành vi bất thường trong ứng dụng"
title: "[Bug]: "
labels: ["type: bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Vui lòng cung cấp chi tiết lỗi để nhóm phát triển có thể tái hiện và khắc phục nhanh chóng.
  - type: textarea
    id: description
    attributes:
      label: "Mô tả lỗi"
      description: "Mô tả rõ ràng hành vi lỗi bạn gặp phải."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Các bước tái hiện (Steps to Reproduce)"
      description: "Liệt kê các bước cụ thể để lỗi xảy ra:"
      value: |
        1. Mở màn hình '...'
        2. Nhập dữ liệu '...'
        3. Bấm nút '...'
        4. Quan sát thấy lỗi: '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Kết quả mong đợi"
      description: "Lẽ ra ứng dụng phải hoạt động như thế nào?"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Thiết bị & Phiên bản Android"
      placeholder: "Ví dụ: Pixel 8 Pro / Android 14 (API 34) Emulator"
    validations:
      required: false
